<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Manage Booking | Tint Conditions</title></head><body><header><div class="brand">TINT <b>CONDITIONS</b></div><a href="/">New booking</a></header><main style="max-width:650px"><div class="eyebrow">APPOINTMENT PORTAL</div><h1>Manage your booking</h1><section class="panel"><div id="details">Loading booking…</div><div id="change" style="display:none"><h2>Reschedule</h2><p>Rescheduling is allowed more than 24 hours before your appointment.</p><label>New date</label><input id="date" type="date"><div class="slots" id="slots"></div><button class="action" id="save">SAVE NEW APPOINTMENT</button><p id="msg"></p></div></section></main><script>const qs=new URLSearchParams(location.search),id=qs.get('id'),token=qs.get('token');let booking,slot='',duration=90;async function get(p,o){const r=await fetch(p,o);const v=await r.json();if(!r.ok)throw Error(v.detail);return v}async function load(){try{booking=await get('/api/booking/'+encodeURIComponent(id)+'?token='+encodeURIComponent(token));document.getElementById('details').innerHTML='<h2>Hi '+booking.name.replaceAll('<','&lt;')+'</h2><p>'+booking.vehicle.replaceAll('<','&lt;')+' · '+booking.film+'</p><p><strong>Status: '+booking.status+'</strong></p><p>'+new Date(booking.starts_at).toLocaleString('en-US',{dateStyle:'full',timeStyle:'short'})+'</p><p>Estimated total: $'+(booking.total_cents/100).toFixed(2)+'</p>';document.getElementById('change').style.display=booking.status==='confirmed'?'block':'none';}catch(e){document.getElementById('details').textContent=e.message}}document.getElementById('date').onchange=async()=>{let conf=await get('/api/config');duration=booking.services.reduce((a,s)=>a+conf.services[s].minutes,15);let data=await get('/api/slots?date='+document.getElementById('date').value+'&duration='+duration);let root=document.getElementById('slots');root.innerHTML='';data.slots.forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{slot=s;root.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};root.appendChild(b)})};document.getElementById('save').onclick=async()=>{try{if(!slot)throw Error('Select a time');await get('/api/booking/'+id+'/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,date:document.getElementById('date').value,time:slot})});document.getElementById('msg').textContent='Rescheduled successfully';load()}catch(e){document.getElementById('msg').textContent=e.message}};load();</script></body></html>
